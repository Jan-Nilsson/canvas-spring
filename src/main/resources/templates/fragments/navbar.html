<header th:fragment="navbar(activePage)" class="site-navbar">

    <!-- BRAND -->

    <a class="site-brand"
       th:href="@{/canvas}"
       aria-label="Canvas home">

        <span class="site-brand-icon">
            <img th:src="@{/favicon.ico}" alt="">
        </span>

        <span class="site-brand-copy">
            <strong>Drawings</strong>
            <small>Canvas Studio</small>
        </span>

    </a>


    <!-- NAVIGATION -->

    <nav class="site-navigation" aria-label="Main navigation">

        <a th:href="@{/canvas}"
           th:classappend="${activePage == 'canvas'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'canvas'} ? 'page' : null">
            Canvas
        </a>

        <a th:href="@{/drawings(tab='all')}"
           th:classappend="${activePage == 'explore'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'explore'} ? 'page' : null">
            Explore
        </a>

        <a th:href="@{/drawings(tab='mine')}"
           th:classappend="${activePage == 'mine'} ? ' is-active' : ''"
           th:attr="aria-current=${activePage == 'mine'} ? 'page' : null">
            My Drawings
        </a>

    </nav>


    <!-- ACTIONS -->

    <div class="navbar-actions">

        <!-- THEME -->

        <button type="button"
                id="themeToggleBtn"
                class="theme-toggle"
                aria-label="Switch to light theme"
                title="Switch to light theme">

            <svg class="theme-icon theme-icon-sun"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.42 1.42"></path>
                <path d="m17.65 17.65 1.42 1.42"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m4.93 19.07 1.42-1.42"></path>
                <path d="m17.65 6.35 1.42-1.42"></path>
            </svg>

            <svg class="theme-icon theme-icon-moon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
            </svg>

            <span class="theme-toggle-label">Theme</span>

        </button>


        <!-- PROFILE MENU -->

        <div class="navbar-account" data-profile-menu>

            <button type="button"
                    id="profileMenuButton"
                    class="profile-menu-trigger"
                    aria-label="Open account menu"
                    title="Account"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-controls="profileMenu">

                <span class="navbar-avatar">

                    <img th:if="${currentUser != null
                                 and !#strings.isEmpty(currentUser.profileImageUrl)}"
                         th:src="${currentUser.profileImageUrl}"
                         alt=""
                         class="navbar-avatar-image">

                    <svg th:unless="${currentUser != null
                                     and !#strings.isEmpty(currentUser.profileImageUrl)}"
                         viewBox="0 0 24 24"
                         aria-hidden="true">

                        <circle cx="12" cy="8" r="3.5"></circle>

                        <path d="M4.8 20c.7-3.6 3.3-5.4 7.2-5.4s6.5 1.8 7.2 5.4"></path>

                    </svg>

                </span>

            </button>


            <!-- DROPDOWN -->

            <div id="profileMenu"
                 class="profile-dropdown"
                 role="menu"
                 hidden>

                <div class="profile-dropdown-heading">

                    <span class="dropdown-user-name"
                          th:text="${currentUser != null
                                    ? currentUser.displayName
                                    : 'Account'}">
                        Account
                    </span>

                    <span class="dropdown-user-handle"
                          th:if="${currentUser != null}"
                          th:text="${'@' + currentUser.username}">
                        @username
                    </span>

                </div>


                <a role="menuitem"
                   th:if="${currentUser != null}"
                   th:href="@{/u/{username}(username=${currentUser.username})}">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M4.8 20c.7-3.6 3.3-5.4 7.2-5.4s6.5 1.8 7.2 5.4"></path>
                    </svg>

                    View profile

                </a>


                <a role="menuitem"
                   th:href="@{/profile/edit}">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h9"></path>
                        <path d="m16.5 3.5 4 4L9 19l-5 1 1-5Z"></path>
                    </svg>

                    Edit profile

                </a>


                <div class="profile-dropdown-divider"></div>


                <form th:action="@{/logout}" method="post">

                    <button type="submit"
                            role="menuitem"
                            class="dropdown-logout">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 17l5-5-5-5"></path>
                            <path d="M15 12H3"></path>
                            <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"></path>
                        </svg>

                        Log out

                    </button>

                </form>

            </div>

        </div>

    </div>

</header>
