<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="/static/js/css/register.css">
    <link rel="stylesheet" href="/static/js/css/commons.css">

    <style>
        .error-message {
            color: red;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Register</h1>

    <div class="error-message">
        <!-- Error message placeholder -->
    </div>

    <form id="registerForm" method="post" action="/register">

        <div class="input-wrapper">
            <input id="regFullName" type="text" name="fullName"
                   placeholder="Full Name" required>
        </div>

        <div class="input-wrapper">
            <input id="regUsername" type="text" name="username"
                   placeholder="Username" required>
        </div>

        <div class="input-wrapper">
            <input id="regPassword" type="password" name="password"
                   placeholder="Password" required>
        </div>

        <div class="input-wrapper">
            <input id="regConfirm" type="password" name="confirmPassword"
                   placeholder="Confirm Password" required>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account?
        <a href="/login">Log In</a>
    </p>
</div>

<script src="/static/js/register.js"></script>
</body>
</html>
